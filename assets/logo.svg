<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2be"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa8214"/>
      <stop offset="100%" stop-color="#e8c758"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162544"/>
      <stop offset="100%" stop-color="#0a1222"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Emblem / Shield -->
  <g transform="translate(10, 6)">
    <!-- Outer Shield with Gold Border -->
    <path d="M 34,4 C 48,4 62,8 62,18 C 62,44 48,60 34,66 C 20,60 6,44 6,18 C 6,8 20,4 34,4 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Inner Filigree Line -->
    <path d="M 34,9 C 45,9 56,12 56,20 C 56,41 45,54 34,59 C 23,54 12,41 12,20 C 12,12 23,9 34,9 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6" stroke-dasharray="2,1" />

    <!-- Crown on top -->
    <path d="M 23,19 L 26,24 L 34,18 L 42,24 L 45,19 L 43,28 L 25,28 Z" 
          fill="url(#goldGrad)" filter="url(#goldGlow)" />
    <circle cx="23" cy="18" r="1.5" fill="#fdf2be" />
    <circle cx="34" cy="17" r="1.8" fill="#fdf2be" />
    <circle cx="45" cy="18" r="1.5" fill="#fdf2be" />

    <!-- Grocery Cart & Wheat Emblem inside shield -->
    <!-- Cart Body -->
    <path d="M 22,33 L 26,33 L 30,46 L 43,46 L 46,36 L 27,36" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Cart Wheels -->
    <circle cx="32" cy="50" r="2.2" fill="url(#goldGrad)" />
    <circle cx="41" cy="50" r="2.2" fill="url(#goldGrad)" />
    <!-- Wheat / Leaf inside cart -->
    <path d="M 35,32 Q 38,26 42,24 M 35,32 Q 33,26 36,22" 
          stroke="#fdf2be" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <!-- Mart Title -->
  <text x="82" y="34" font-family="'Cinzel', 'Times New Roman', serif" font-size="21" font-weight="800" letter-spacing="1.5" fill="url(#goldGrad)">
    GUPTA GROCERY
  </text>
  <text x="82" y="52" font-family="'Cinzel', 'Times New Roman', serif" font-size="16" font-weight="700" letter-spacing="4" fill="#ffffff">
    MART
  </text>
  
  <!-- Premium Subtitle Badge -->
  <rect x="144" y="41" width="138" height="13" rx="2" fill="#72192d" opacity="0.95" />
  <text x="213" y="51" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.8" fill="#fdf2be" text-anchor="middle">
    PREMIUM RETAIL POS
  </text>
</svg>
